name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  blogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SANITY_STUDIO_PROJECT_ID: abcdefgh
          SANITY_STUDIO_DATASET: production
